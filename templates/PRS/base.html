           /* Basic navbar styling */
.header_section {
    background-color: #fff; /* Background color of the header */
    padding: 10px 0; /* Padding around the header */
    border-bottom: 1px solid #ddd; /* Optional: border for separation */
}

.custom_nav-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.navbar-brand {
    font-size: 24px; /* Size of the brand text */
    font-weight: bold;
}

.navbar-toggler {
    border: none; /* Remove border from the toggler */
}

.navbar-toggler-icon {
    background-image: url("data:image/svg+xml,..."); /* Add a custom icon if needed */
}

.navbar-nav {
    margin-left: auto;
}

.nav-link {
    padding: 8px 15px; /* Adjust padding around links */
    font-size: 16px; /* Font size of the links */
    color: #333; /* Text color */
}

.nav-link:hover {
    color: #007bff; /* Color on hover */
}

.dropdown-menu {
    min-width: 150px; /* Minimum width of the dropdown menu */
}

.dropdown-item {
    font-size: 16px; /* Font size of dropdown items */
    padding: 10px 15px; /* Padding around dropdown items */
}

.navbar-nav .nav-item {
    margin: 0 10px; /* Space between nav items */
}

.navbar-nav .nav-item.active .nav-link {
    font-weight: bold; /* Bold text for active item */
    color: #007bff; /* Color for active link */
}

       </style>
