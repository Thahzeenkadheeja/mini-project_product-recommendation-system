{% extends 'Seller/base.html' %}
{% block title %}
Seller | Edit Profile
{% endblock %}
{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-lg p-3 mb-5 bg-white rounded animate__animated animate__fadeIn">
        <div class="card-header text-center">
          <h3>Edit Seller Profile</h3>
        </div>
        <div class="card-body">
          <form method="POST" enctype="multipart/form-data" action="/seller_edit_profile_post">
            {% csrf_token %}
            <input type="hidden" name="id" value="{{ seller.id }}">

            <!-- Name field -->
            <div class="form-group mb-3">
              <label for="name">Name</label>
              <input type="text" id="name" name="name" class="form-control" value="{{ seller.name }}" required>
            </div>

            <!-- Place field -->
            <div class="form-group mb-3">
              <label for="place">Place</label>
              <input type="text" id="place" name="place" class="form-control" value="{{ seller.place }}" required>
            </div>

            <!-- Phone field -->
            <div class="form-group">
   <label for="phone">Phone</label>
   <input type="text" value="{{ seller.phone }}" id="phone" name="phone" required>
   <small id="phone-error" style="color: red; display: none;">Please enter a valid phone number</small>
</div>

            <!-- Email field -->
            <div class="form-group mb-3">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" class="form-control" value="{{ seller.email }}" required>
            </div>

            <!-- Profile Image -->
            <div class="form-group mb-3">
              <label for="image">Profile Image</label><br>
              <img src="{{ seller.image.url }}" alt="Current Profile Image" class="img-thumbnail mb-3" style="width: 150px; height: 100px; object-fit: cover;">
<input type="file" id="image" name="image" accept=".jpg, .jpeg, .png" >
                      <small id="file-error" style="color: red; display: none;">Please upload a valid image file (jpg, jpeg, png).</small>
            </div>
            <div class="form-group mb-3">
              <label for="email">Seller Id</label>
              <input type="file" id="image" name="sellerid" accept=".jpg, .jpeg, .png" >
            </div>
            <!-- Submit button -->
            <div class="text-center">
              <button type="submit" id="submit-btn" class="btn btn-primary animate__animated animate__pulse">Save Changes</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
    <script>
    document.getElementById('phone').addEventListener('input', function() {
   var phoneInput = document.getElementById('phone').value;
   var errorMessage = document.getElementById('phone-error');

   // Phone number pattern: Adjust this as per your requirements
   var phonePattern = /^[0-9]{10}$/; // Example for 10 digits numeric phone number

   // Check if phone number matches the pattern
   if (phonePattern.test(phoneInput)) {
      // If valid, hide the error message
      errorMessage.style.display = 'none';
      document.getElementById('phone').style.borderColor = ''; // Reset border color
   } else {
      // If invalid, show the error message
      errorMessage.style.display = 'block';
      document.getElementById('phone').style.borderColor = 'red'; // Optional: Add red border to input
   }
});

// Optionally, prevent form submission if the phone number is invalid
document.getElementById('submit-btn').addEventListener('click', function(event) {
   var phoneInput = document.getElementById('phone').value;
   var phonePattern = /^[0-9]{10}$/; // Example for 10 digits numeric phone number

   if (!phonePattern.test(phoneInput)) {
      event.preventDefault(); // Prevent form submission if phone number is invalid
      document.getElementById('phone-error').style.display = 'block';
   }
});

</script>

    <script>
       document.getElementById('image').addEventListener('change', function() {
   var fileInput = document.getElementById('image');
   var filePath = fileInput.value;
   var allowedExtensions = /(\.jpg|\.jpeg|\.png)$/i;
   var errorMessage = document.getElementById('file-error');

   // Check if file extension matches the allowed formats
   if (!allowedExtensions.exec(filePath)) {
      // If invalid, show error message and clear the file input
      errorMessage.style.display = 'block';
      fileInput.value = ''; // Reset the input
   } else {
      // If valid, hide error message
      errorMessage.style.display = 'none';
   }
});

   </script>

{% endblock %}
