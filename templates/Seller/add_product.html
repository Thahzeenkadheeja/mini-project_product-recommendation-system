{% extends 'Seller/base.html' %}
{% block content %}

<div class="container mt-5">
  <h2 class="mb-4">Add New Product</h2>
  <form id="add-product-form" method="POST" enctype="multipart/form-data" action="/seller_add_product">
    {% csrf_token %}

    <!-- Product Name -->
    <div class="form-group mb-3">
      <label for="product_name">Product Name</label>
      <input type="text" id="product_name" name="product_name" class="form-control" placeholder="Enter product name" required>
    </div>

    <!-- Price -->
    <div class="form-group mb-3">
      <label for="price">Price</label>
      <input type="number" id="price" name="price" class="form-control" placeholder="Enter product price" required>
    </div>

    <!-- Stock -->
    <div class="form-group mb-3">
      <label for="stock">Stock</label>
      <input type="number" id="stock" name="stock" class="form-control" placeholder="Enter stock quantity" required>
    </div>

    <!-- Product Image -->
    <div class="form-group mb-4">
      <label for="image">Product Image</label>
      <input type="file" id="image" name="image" accept=".jpg, .jpeg, .png" required>
      <small id="file-error" style="color: red; display: none;">Please upload a valid image file (jpg, jpeg, png).</small>
    </div>

    <!-- Submit Button -->
    <button type="submit" id="submit-btn" class="btn btn-primary">Add Product</button>
    <a href="/seller_manage_products" class="btn btn-secondary">Cancel</a>

  </form>
</div>

<script>
  // File input validation
  document.getElementById('image').addEventListener('change', function() {
    var fileInput = document.getElementById('image');
    var filePath = fileInput.value;
    var allowedExtensions = /(\.jpg|\.jpeg|\.png)$/i;
    var errorMessage = document.getElementById('file-error');

    // Check if file extension matches the allowed formats
    if (!allowedExtensions.exec(filePath)) {
      // If invalid, show error message and clear the file input
      errorMessage.style.display = 'block';
      fileInput.value = ''; // Reset the input
    } else {
      // If valid, hide error message
      errorMessage.style.display = 'none';
    }
  });

  // Prevent form submission if the image is invalid
  document.getElementById('add-product-form').addEventListener('submit', function(event) {
    var fileInput = document.getElementById('image');
    var filePath = fileInput.value;
    var allowedExtensions = /(\.jpg|\.jpeg|\.png)$/i;
    var errorMessage = document.getElementById('file-error');

    // Check if a file was selected and validate it
    if (filePath && !allowedExtensions.exec(filePath)) {
      event.preventDefault(); // Prevent form submission
      errorMessage.style.display = 'block'; // Show error message
    } else {
      errorMessage.style.display = 'none'; // Hide error message if valid
    }
  });
</script>

{% endblock %}
